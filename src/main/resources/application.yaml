spring:
  application:
    name: vibe-llm
  banner:
    # 프로필 미지정 시 Spring Boot 의 기본 프로필명이 "default" 라 config/banner/default 와 그대로 맞물린다.
    location: classpath:config/banner/${spring.profiles.active:default}
  messages:
    basename: config/message/messages
  datasource:
    url     : jdbc:postgresql://localhost:54320/postgres?currentSchema=public
    username: postgres
    password: 1234
  servlet:
    multipart:
      enabled            : true
      max-file-size      : 50MB
      max-request-size   : 50MB
      file-size-threshold: 50MB
      location           : tmp/uploads/vibe-llm
  flyway:
    # 테이블이 이미 존재하는 기존 개발 DB 에서도 V1 이 실행되도록 baseline 을 0 으로 둔다.
    # V1 은 멱등하므로 신규 DB 와 기존 DB 모두 같은 결과가 된다.
    baseline-on-migrate: true
    baseline-version   : 0
    schemas            : public
  jpa:
    hibernate:
      # 엔티티가 매핑한 테이블만 대상이다. Flyway 가 소유하는 테이블에는
      # 매핑되는 엔티티가 없으므로 Hibernate 가 건드리지 않는다.
      ddl-auto: none
    open-in-view: false
  ai:
    openai:
      base-url: http://127.0.0.1:12345/v1
      api-key : lm-studio
      chat:
        model     : qwen3.8-4b-distill
        max-tokens: 2048
      embedding:
        model          : text-embedding-qwen3-embedding-0.6b
        encoding-format: float
    chat:
      memory:
        repository:
          jdbc:
            # 스키마는 Flyway 가 소유한다. db/migration/V1__spring_ai_schema.sql 참고
            initialize-schema: never
    vectorstore:
      pgvector:
        # 스키마는 Flyway 가 소유한다. db/migration/V1__spring_ai_schema.sql 참고
        initialize-schema: false
        schema-name      : public
        dimensions       : 1024
        index-type       : HNSW
        distance-type    : COSINE_DISTANCE
        table-name       : vector_store

mybatis:
  configuration:
    # ingested_at -> ingestedAt. DocumentSummary record 생성자 매핑에 필요하다.
    map-underscore-to-camel-case           : true
    # record 생성자를 컬럼 순서가 아니라 이름으로 매핑한다. SELECT 절 순서가 바뀌어도 깨지지 않는다.
    arg-name-based-constructor-auto-mapping: true

server:
  port: 9999
logging:
  config: classpath:config/logback/logback.xml
property:
  api:
    end-point: /api
  attach:
    store-location: d:/temp
  integrate:
    docling:
      end-point: http://localhost:50010
      options:
        # CPU 이미지는 변환이 느리다. 분석은 청킹 + 마크다운 변환으로 두 번 변환한다
        read-timeout: 10m
