<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|vibe-llm · ${pageTitle}|">vibe-llm</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="nav(active)" class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/ui}">vibe-llm</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#nav-links" aria-controls="nav-links"
                aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav-links">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ui}"
                       th:classappend="${active == 'chat'} ? 'active fw-semibold' : ''"
                       th:attr="aria-current=${active == 'chat'} ? 'page' : null">RAG 비교 채팅</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ui/documents}"
                       th:classappend="${active == 'documents'} ? 'active fw-semibold' : ''"
                       th:attr="aria-current=${active == 'documents'} ? 'page' : null">문서</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ui/stream}"
                       th:classappend="${active == 'stream'} ? 'active fw-semibold' : ''"
                       th:attr="aria-current=${active == 'stream'} ? 'page' : null">스트리밍</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link link-secondary" th:href="@{/swagger-ui.html}">Swagger</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script th:src="@{/js/markdown.js}"></script>
</footer>

</body>
</html>
