<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|DocuAI · ${pageTitle}|">DocuAI</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}::-webkit-scrollbar{display:none;}</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "error-container": "#ffdad6", "primary-fixed": "#e2dfff", "on-primary": "#ffffff", "outline": "#777587", "outline-variant": "#c7c4d8", "on-error-container": "#93000a", "on-surface": "#0b1c30", "on-secondary-fixed": "#131b2e", "on-surface-variant": "#464555", "on-error": "#ffffff", "surface-variant": "#d3e4fe", "tertiary-fixed": "#6ffbbe", "on-secondary-fixed-variant": "#3f465c", "secondary": "#565e74", "on-background": "#0b1c30", "on-tertiary-fixed-variant": "#005236", "inverse-primary": "#c3c0ff", "error": "#ba1a1a", "primary": "#3525cd", "surface-tint": "#4d44e3", "secondary-fixed": "#dae2fd", "surface-container-highest": "#d3e4fe", "secondary-fixed-dim": "#bec6e0", "secondary-container": "#dae2fd", "surface": "#f8f9ff", "tertiary": "#005338", "on-tertiary": "#ffffff", "on-primary-fixed-variant": "#3323cc", "tertiary-fixed-dim": "#4edea3", "surface-container-low": "#eff4ff", "surface-bright": "#f8f9ff", "on-secondary-container": "#5c647a", "primary-container": "#4f46e5", "surface-container-lowest": "#ffffff", "background": "#f8f9ff", "inverse-on-surface": "#eaf1ff", "on-primary-fixed": "#0f0069", "tertiary-container": "#006e4b", "on-tertiary-fixed": "#002113", "on-primary-container": "#dad7ff", "surface-container-high": "#dce9ff", "surface-container": "#e5eeff", "surface-dim": "#cbdbf5", "primary-fixed-dim": "#c3c0ff", "inverse-surface": "#213145", "on-secondary": "#ffffff", "on-tertiary-container": "#67f4b7" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "margin-mobile": "1rem", "gutter-mobile": "0.75rem", "space-sm": "0.5rem", "space-lg": "1rem", "space-xs": "0.25rem", "space-md": "0.75rem", "space-xl": "1.5rem", "margin": "2rem", "gutter": "1.5rem" }, "fontFamily": { "display-lg": [ "Plus Jakarta Sans" ], "label-sm": [ "Inter" ], "headline-sm": [ "Plus Jakarta Sans" ], "headline-lg": [ "Plus Jakarta Sans" ], "body-sm": [ "Inter" ], "headline-lg-mobile": [ "Plus Jakarta Sans" ], "title-md": [ "Inter" ], "body-lg": [ "Inter" ], "headline-md": [ "Plus Jakarta Sans" ], "label-md": [ "Inter" ], "title-sm": [ "Inter" ], "code-inline": [ "JetBrains Mono" ], "body-md": [ "Inter" ] }, "fontSize": { "display-lg": [ "40px", { "lineHeight": "48px", "letterSpacing": "-0.025em", "fontWeight": "700" } ], "label-sm": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" } ], "headline-sm": [ "20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "headline-lg": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" } ], "body-sm": [ "13px", { "lineHeight": "18px", "fontWeight": "400" } ], "headline-lg-mobile": [ "26px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "600" } ], "title-md": [ "16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "body-lg": [ "16px", { "lineHeight": "26px", "fontWeight": "400" } ], "headline-md": [ "24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" } ], "label-md": [ "12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" } ], "title-sm": [ "14px", { "lineHeight": "20px", "letterSpacing": "-0.005em", "fontWeight": "600" } ], "code-inline": [ "12px", { "lineHeight": "16px", "fontWeight": "500" } ], "body-md": [ "14px", { "lineHeight": "22px", "fontWeight": "400" } ] } } } };</script>
</head>
<body>

<aside th:fragment="sidebar(active)" class="fixed left-0 top-0 h-full w-64 bg-surface-container-lowest shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-50 flex flex-col justify-between select-none">
    <div class="flex flex-col">
        <div class="h-16 px-space-lg flex items-center justify-between">
            <div class="flex items-center gap-space-sm min-w-0">
                <span class="h-8 w-8 rounded-lg bg-primary flex items-center justify-center flex-shrink-0 relative">
                    <span class="material-symbols-outlined text-on-primary text-[18px]">description</span>
                    <span class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-tertiary-fixed-dim border border-surface-container-lowest"></span>
                </span>
                <span class="font-headline-sm text-headline-sm text-on-surface truncate">DocuAI</span>
            </div>
            <span class="px-space-xs py-0.5 bg-primary-fixed text-on-primary-fixed font-label-sm text-label-sm rounded-full">PRO</span>
        </div>
        <div class="px-space-md py-space-sm">
            <nav class="space-y-1 flex flex-col">
                <a th:href="@{/ui/document}"
                   th:classappend="${active == 'documents'} ? 'bg-surface-container-high text-primary font-title-sm font-semibold' : 'text-on-surface-variant hover:bg-surface-container hover:text-on-surface'"
                   class="flex items-center gap-space-md px-space-md py-space-sm rounded-xl transition-colors">
                    <span class="material-symbols-outlined text-[20px]">folder</span>
                    <span class="font-title-sm text-title-sm flex-1 truncate">문서 보관함</span>
                </a>
                <a th:href="@{/ui/chat}"
                   th:classappend="${active == 'ai-chat'} ? 'bg-surface-container-high text-primary font-title-sm font-semibold' : 'text-on-surface-variant hover:bg-surface-container hover:text-on-surface'"
                   class="flex items-center gap-space-md px-space-md py-space-sm rounded-xl transition-colors">
                    <span class="material-symbols-outlined text-[20px]">auto_awesome</span>
                    <span class="font-title-sm text-title-sm flex-1 truncate">AI 채팅</span>
                    <span class="px-1.5 py-0.5 bg-tertiary-fixed text-on-tertiary-fixed font-label-sm text-label-sm rounded-full">AI</span>
                </a>
            </nav>
        </div>
    </div>
    <div class="p-space-md m-space-sm rounded-xl bg-surface-container-low">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-space-sm min-w-0">
                <div class="w-8 h-8 rounded-full bg-primary-fixed text-primary flex items-center justify-center font-label-sm text-label-sm font-bold flex-shrink-0">이</div>
                <div class="flex flex-col min-w-0">
                    <span class="font-title-sm text-title-sm text-on-surface truncate">이지은 PM</span>
                    <span class="font-label-sm text-label-sm text-on-surface-variant truncate">jieun.lee@docuai.io</span>
                </div>
            </div>
            <a class="p-space-xs text-on-surface-variant hover:text-on-surface rounded-lg hover:bg-surface-container transition-colors flex-shrink-0" href="#">
                <span class="material-symbols-outlined text-[20px]">settings</span>
            </a>
        </div>
    </div>
</aside>

</body>
</html>
