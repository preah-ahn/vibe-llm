<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="edit-modal">
    <!-- ============ 문서 수정 모달 ============ -->
    <div class="modal-overlay hidden fixed inset-0 z-50 bg-inverse-surface/40 backdrop-blur-md flex items-center justify-center p-6" id="modal-edit" onclick="if(event.target===this) closeModal('modal-edit')">
        <div class="w-full max-w-[820px] bg-surface-container-lowest rounded-xl shadow-2xl flex flex-col overflow-hidden max-h-[92vh]">
            <div class="px-8 pt-7 pb-5 flex items-start justify-between bg-surface-container-lowest">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 rounded-xl bg-primary-fixed text-primary flex items-center justify-center flex-shrink-0 shadow-sm">
                        <span class="material-symbols-outlined text-[26px]">edit_document</span>
                    </div>
                    <div class="flex flex-col gap-1 min-w-0">
                        <div class="flex items-center gap-2.5">
                            <h2 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">문서 수정</h2>
                            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-secondary-container text-on-secondary-fixed font-label-sm text-label-sm border border-outline-variant/30" id="edit-status-chip">
                                <span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span><span id="edit-status-label">상태: -</span>
                            </span>
                        </div>
                        <p class="font-body-sm text-body-sm text-on-surface-variant">문서의 메타데이터(이름, 설명)를 수정할 수 있습니다. 첨부파일은 데이터 무결성을 위해 수정/교체가 불가합니다.</p>
                    </div>
                </div>
                <button aria-label="창 닫기" class="w-9 h-9 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" id="closeModalBtn" type="button">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>
            <div class="px-8 py-5 flex flex-col gap-6 overflow-y-auto max-h-[calc(92vh-160px)]">
                <div class="flex flex-col gap-1.5">
                    <div class="flex items-center justify-between">
                        <label class="font-title-sm text-title-sm text-on-surface flex items-center gap-1" for="docNameInput">문서 이름 <span class="text-error font-bold">*</span></label>
                        <span class="font-label-sm text-label-sm text-on-surface-variant">워크스페이스 내 식별명</span>
                    </div>
                    <input class="w-full h-11 px-3.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary transition-all" id="docNameInput" type="text">
                </div>
                <div class="flex flex-col gap-2">
                    <div class="flex items-center justify-between">
                        <label class="font-title-sm text-title-sm text-on-surface flex items-center gap-1">첨부 파일 <span class="text-on-surface-variant font-normal text-label-sm">(기존 등록 파일)</span></label>
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-surface-container text-secondary font-label-sm text-label-sm border border-outline-variant/30">
                            <span class="material-symbols-outlined text-[14px]">lock</span>수정 불가 (파일 고정)
                        </span>
                    </div>
                    <div class="w-full p-4 rounded-xl bg-surface-container-high/40 border border-outline-variant/30 flex items-center justify-between shadow-sm select-none">
                        <div class="flex items-center gap-3.5 min-w-0">
                            <div class="w-11 h-11 rounded-lg bg-surface-container-lowest text-secondary flex items-center justify-center flex-shrink-0 shadow-sm">
                                <span class="material-symbols-outlined text-[26px]" id="edit-file-icon">picture_as_pdf</span>
                            </div>
                            <div class="flex flex-col min-w-0 gap-0.5">
                                <div class="flex items-center gap-2">
                                    <span class="font-title-sm text-title-sm text-on-surface truncate font-medium" id="edit-file-name"></span>
                                    <span class="px-2 py-0.5 rounded-full bg-surface-container text-secondary font-label-sm text-label-sm flex-shrink-0 font-medium">고정됨</span>
                                </div>
                                <div class="flex items-center gap-3 font-label-md text-label-md text-on-surface-variant">
                                    <span>용량: <strong class="text-on-surface font-medium" id="edit-file-size"></strong></span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container text-secondary font-label-sm text-label-sm flex-shrink-0 border border-outline-variant/30">
                            <span class="material-symbols-outlined text-[16px]">lock</span><span>수정 불가</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 px-1 text-on-surface-variant font-label-sm text-label-sm">
                        <span class="material-symbols-outlined text-[16px] text-secondary flex-shrink-0">info</span>
                        <span>※ 첨부파일은 벡터 임베딩 및 인덱싱 무결성 유지를 위해 교체할 수 없습니다. 새 파일 등록은 신규 문서를 이용해주세요.</span>
                    </div>
                </div>
                <div class="flex flex-col gap-1.5">
                    <div class="flex items-center justify-between">
                        <label class="font-title-sm text-title-sm text-on-surface flex items-center gap-1.5" for="docDescription">문서 설명 <span class="font-label-sm text-label-sm text-on-surface-variant font-normal">(선택)</span></label>
                        <span class="font-label-sm text-label-sm text-on-surface-variant">AI 색인 시 컨텍스트 보조 정보로 활용</span>
                    </div>
                    <textarea class="w-full p-3.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary transition-all resize-none leading-relaxed" id="docDescription" rows="3"></textarea>
                </div>
            </div>
            <div class="px-8 py-5 bg-surface-container-low flex items-center justify-between">
                <button class="h-10 px-3.5 rounded-lg text-error hover:bg-error-container hover:text-on-error-container font-title-sm text-title-sm flex items-center gap-1.5 transition-colors" id="deleteDocBtn" type="button">
                    <span class="material-symbols-outlined text-[18px]">delete_forever</span><span>문서 삭제</span>
                </button>
                <div class="flex items-center gap-3">
                    <button class="h-10 px-5 rounded-lg bg-surface-container-lowest border border-outline-variant/30 text-on-surface hover:bg-surface-container font-medium text-title-sm shadow-sm transition-colors" id="cancelBtn" type="button">닫기</button>
                    <button class="h-10 px-6 rounded-lg bg-primary hover:bg-primary-container text-on-primary font-title-sm text-title-sm flex items-center gap-2 shadow-md transition-all active:scale-[0.99]" id="saveDocBtn" type="button">
                        <span class="material-symbols-outlined text-[18px]">check_circle</span><span>변경사항 저장</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            const closeBtn = document.querySelector('#closeModalBtn');
            const cancelBtn = document.querySelector('#cancelBtn');
            const saveBtn = document.querySelector('#saveDocBtn');
            const deleteBtn = document.querySelector('#deleteDocBtn');
            const nameInput = document.querySelector('#docNameInput');
            const descriptionInput = document.querySelector('#docDescription');

            let editing = null;

            window.openEditModal = async function (documentId) {
                openModal('modal-edit');
                try {
                    editing = await apiFetch(`/documents/${documentId}`);
                    const status = statusMeta(editing.statusType);
                    document.querySelector('#edit-status-label').textContent = `상태: ${status.label}`;
                    nameInput.value = editing.name;
                    descriptionInput.value = editing.description || '';
                    document.querySelector('#edit-file-icon').textContent = fileIcon(editing.file.originalName).icon;
                    document.querySelector('#edit-file-name').textContent = editing.file.originalName;
                    document.querySelector('#edit-file-size').textContent = formatBytes(editing.file.size);
                } catch (e) {
                    alert(e.message);
                    closeModal('modal-edit');
                }
            };

            if (closeBtn) closeBtn.addEventListener('click', () => closeModal('modal-edit'));
            if (cancelBtn) cancelBtn.addEventListener('click', () => closeModal('modal-edit'));
            if (saveBtn) {
                saveBtn.addEventListener('click', async () => {
                    if (!editing) return;
                    if (!nameInput.reportValidity()) return;
                    const original = saveBtn.innerHTML;
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>저장 및 인덱싱 처리 중...</span>';
                    try {
                        await apiFetch(`/documents/${editing.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: nameInput.value,
                                description: descriptionInput.value || null,
                                url: editing.url || null,
                                file: editing.file,
                            }),
                        });
                        document.dispatchEvent(new CustomEvent('documents:changed'));
                        closeModal('modal-edit');
                    } catch (e) {
                        alert(e.message);
                    } finally {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = original;
                    }
                });
            }
            if (deleteBtn) {
                deleteBtn.addEventListener('click', async () => {
                    if (!editing) return;
                    if (confirm('이 문서를 영구 보관함에서 삭제하시겠습니까? 연결된 AI 색인 청크도 함께 회수됩니다.')) {
                        try {
                            await apiFetch(`/documents/${editing.id}`, { method: 'DELETE' });
                            document.dispatchEvent(new CustomEvent('documents:changed'));
                            closeModal('modal-edit');
                        } catch (e) {
                            alert(e.message);
                        }
                    }
                });
            }
        })();
    </script>
</th:block>
</body>
</html>
