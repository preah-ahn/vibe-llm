<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('스트리밍 채팅')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('stream')}"></nav>

<main class="container pb-5">

    <h1 class="h4 mb-1">스트리밍 채팅</h1>
    <p class="text-body-secondary small mb-4">
        기존 <code>/chat-streams</code> 엔드포인트입니다. RAG 를 사용하지 않고,
        <code>system-message.st</code> 의 Java 코딩 가이드 페르소나로 응답합니다.
        입력값은 <code>user-message.st</code> 의 <code>{concept}</code> 에 치환됩니다.
    </p>

    <form id="stream-form" class="card card-body mb-4" novalidate>
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label for="concept" class="form-label">개념</label>
                <input type="text" class="form-control" id="concept" value="record" required
                       placeholder="예: record, sealed class">
                <div class="invalid-feedback">개념을 입력하세요.</div>
            </div>
            <div class="col-md-4">
                <label for="stream-conversation" class="form-label">conversationId</label>
                <input type="text" class="form-control" id="stream-conversation" value="ui-stream">
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-fill" id="stream-btn">전송</button>
            </div>
        </div>
    </form>

    <div id="stream-error" class="alert alert-danger d-none" role="alert"></div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold">응답</span>
            <span id="stream-status" class="badge text-bg-secondary">대기</span>
        </div>
        <div class="card-body">
            <div id="stream-output" class="stream-output markdown-body mb-0" aria-live="polite">전송하면 토큰이 도착하는 대로 출력됩니다.</div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: scripts}"></footer>
<script th:src="@{/js/stream.js}"></script>
</body>
</html>
