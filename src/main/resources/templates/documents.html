<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('문서')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('documents')}"></nav>

<main class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-1">
        <h1 class="h4 mb-0">문서 관리</h1>
        <button type="button" class="btn btn-primary" id="add-btn">새 문서</button>
    </div>
    <p class="text-body-secondary small mb-4">
        문서 메타데이터와 첨부 파일을 등록·수정·삭제합니다. 상태는 표에서 바로 바꿀 수 있습니다.
    </p>

    <form id="search-form" class="row g-2 align-items-end mb-3" novalidate>
        <div class="col-auto">
            <label for="search-name" class="form-label small mb-1">이름</label>
            <input type="text" class="form-control form-control-sm" id="search-name" placeholder="문서명 검색">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-sm btn-outline-secondary">검색</button>
        </div>
    </form>

    <div id="list-error" class="alert alert-danger d-none" role="alert"></div>

    <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
            <thead>
            <tr>
                <th scope="col" style="width: 4rem">ID</th>
                <th scope="col">이름</th>
                <th scope="col" style="width: 11rem">상태</th>
                <th scope="col">파일</th>
                <th scope="col" style="width: 10rem">등록일시</th>
                <th scope="col" class="text-end" style="width: 9rem">작업</th>
            </tr>
            </thead>
            <tbody id="doc-rows">
            <tr id="list-loading">
                <td colspan="6" class="text-body-secondary">
                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>불러오는 중…
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p id="list-empty" class="text-body-secondary fst-italic d-none mt-3">등록된 문서가 없습니다.</p>

    <div id="pagination-bar" class="d-flex justify-content-between align-items-center mt-3 d-none">
        <div class="small text-body-secondary" id="pagination-info"></div>
        <div class="btn-group btn-group-sm" role="group" aria-label="페이지 이동">
            <button type="button" class="btn btn-outline-secondary" id="page-prev">이전</button>
            <button type="button" class="btn btn-outline-secondary" id="page-next">다음</button>
        </div>
    </div>

</main>

<div class="modal fade" id="document-modal" tabindex="-1" aria-labelledby="document-modal-title" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="document-form" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h6" id="document-modal-title">새 문서</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div id="document-form-error" class="alert alert-danger d-none py-2" role="alert"></div>

                    <div class="mb-3">
                        <label for="doc-name" class="form-label">이름</label>
                        <input type="text" class="form-control" id="doc-name" maxlength="50" required>
                        <div class="invalid-feedback">이름을 입력하세요 (최대 50자).</div>
                    </div>
                    <div class="mb-3">
                        <label for="doc-description" class="form-label">설명</label>
                        <textarea class="form-control" id="doc-description" rows="3" maxlength="4000"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="doc-url" class="form-label">URL</label>
                        <input type="url" class="form-control" id="doc-url" maxlength="4000">
                    </div>
                    <div class="mb-2">
                        <label for="doc-file" class="form-label">파일</label>
                        <input type="file" class="form-control" id="doc-file">
                        <div class="form-text" id="doc-file-current"></div>
                        <div class="invalid-feedback">파일을 선택하세요.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary" id="document-save-btn">저장</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-modal-title" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title h6" id="delete-modal-title">문서 삭제</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0"><strong id="delete-target"></strong> 문서를 삭제합니다. 되돌릴 수 없습니다.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-danger" id="delete-confirm">삭제</button>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: scripts}"></footer>
<script th:src="@{/js/documents.js}"></script>
</body>
</html>
